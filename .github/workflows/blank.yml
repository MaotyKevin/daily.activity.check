name: Daily Auto Commit

on:
  schedule:
    # 23:05 UTC corresponds to 02:05 AM UTC+3
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "Auto-commit: $(date '+%Y-%m-%d at %H:%M UTC')" >> activity_log.txt

      - name: Commit and push
        run: |
          git config user.name "MaotyKevin"
          git config user.email "maotykevin@gmail.com"
          git add activity_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily activity update $(date +'%Y-%m-%d')" && git push)